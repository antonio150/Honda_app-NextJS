
services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honda_app_nextjs
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"

    command: npm run dev -- --hostname 0.0.0.0
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - .git/
            - .next/
            - node_modules/
            - package.json
            - package-lock.json
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
